name: Release

on:
  release:
    types: [published]

jobs:
  # ── Docker image → GHCR ─────────────────────────────────────────────────────
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mousebeast/shiftable:latest
            ghcr.io/mousebeast/shiftable:${{ github.ref_name }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Setup wizard binaries → release assets ───────────────────────────────────
  wizard:
    name: Build setup wizard (${{ matrix.label }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - label:   Windows
            goos:    windows
            goarch:  amd64
            out:     shiftable-setup-windows.exe
            ldflags: "-H windowsgui"
          - label:   macOS (Apple Silicon)
            goos:    darwin
            goarch:  arm64
            out:     shiftable-setup-mac-arm64
            ldflags: ""
          - label:   macOS (Intel)
            goos:    darwin
            goarch:  amd64
            out:     shiftable-setup-mac-amd64
            ldflags: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cmd/setup/go.sum

      - name: Install icon tools (Windows only)
        if: matrix.goos == 'windows'
        run: sudo apt-get install -y imagemagick mingw-w64

      - name: Embed icon (Windows only)
        if: matrix.goos == 'windows'
        working-directory: cmd/setup
        run: |
          convert ../../client/public/icons/icon-512.png \
            -define icon:auto-resize=256,128,64,48,32,16 \
            icon.ico
          printf 'IDI_ICON1 ICON "icon.ico"\n' > resource.rc
          x86_64-w64-mingw32-windres resource.rc -O coff -o resource.syso

      - name: Build
        working-directory: cmd/setup
        env:
          GOOS:   ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags="-X main.releaseTag=${{ github.ref_name }} ${{ matrix.ldflags }}" \
            -o ${{ matrix.out }} .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: cmd/setup/${{ matrix.out }}
